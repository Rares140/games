function updateStatus(t) {

function translate(ts,td,dir,dirplus,delta) {

  for(let i=0;i<ts.length;i++){
    for(let j=0;j<3;j++) {  
      td[i][j]=ts[i][j] + (j==dir ? dirplus : 0)
    }
  }
  if(delta != null){
    delta[dir] += dirplus
  }

  updateStatus(t)  
}

function translateAll(ts,td,dplus,delta){

  translate(ts,td,0,dplus[0],delta)
  translate(ts,td,1,dplus[1],delta)
  translate(ts,td,2,dplus[2],delta)
}

function perspective(ts,td,factor) {

  if (!enablePerspective.checked) {
    return;
  }

  for(let i=0;i<ts.length;i++){
    td[i][0] = ts[i][0] * factor / ts[i][2]
    td[i][1] = ts[i][1] * factor / ts[i][2]
  }
  updateStatus(td)
}

function perspective_inversion(ts,td,factor) {

  if (!enablePerspective.checked) {
    return;
  }

  for(let i=0;i<ts.length;i++){
    td[i][0] = ts[i][0] * ts[i][2] / factor 
    td[i][1] = ts[i][1] * ts[i][2] / factor
  }
  updateStatus(td);
}

function scale(ts,td,dir,factor) {

  for(let i=0;i<ts.length;i++) {
    for(let j=0;j<3;j++) {
      td[i][j] = ts[i][j] * (j === dir ? factor : 1) 
    }
  }
}

function minus(ts) {
  
  let tr = []
  for (let i=0; i<ts.length; i++) {
    tr[i] = -ts[i]
  }
  return tr;
}

function rotateOne(ts,td,dir,angle) {

  for(i=0;i<ts.length;i++){
    if(dir==0) {
      td[i][0] = ts[i][0]
      a        = ts[i][1] * Math.cos(angle) - ts[i][2] * Math.sin(angle) 
      td[i][2] = ts[i][1] * Math.sin(angle) + ts[i][2] * Math.cos(angle)
      td[i][1] = a 
    }
    else if(dir==1) {
      td[i][1] = ts[i][1]
      a        = ts[i][0] * Math.cos(angle) - ts[i][2] * Math.sin(angle)
      td[i][2] = ts[i][0] * Math.sin(angle) + ts[i][2] * Math.cos(angle)
      td[i][0] = a 
    }
    else if(dir==2) {
      td[i][2] = ts[i][2]
      a        = ts[i][0] * Math.cos(angle) - ts[i][1] * Math.sin(angle) 
      td[i][1] = ts[i][0] * Math.sin(angle) + ts[i][1] * Math.cos(angle)
      td[i][0] = a 
    }
  }
  updateStatus(td)
}

function rotate(ts, td, dir, angle) {
  rotateOne(ts,td,dir,angle);
  rotateOne(norm, norm, dir, angle)
}

function calculateNormals(tt,spf,nrm){
  //nrm =cross_product(v1,v2)
  //v1=caaalculaatevector(p1, p2)
  //v2=..................(p2, p3)
  //p1=tt[spf[i][0]]
  //p2=tt[spf[i][1]]
  //p3=tt[spf[i][2]]       
  for(i=0;i<spf.length;i++){
    p1=tt[spf[i][0]]
    p2=tt[spf[i][1]]
    p3=tt[spf[i][2]]

    v1=calculateVector(p1,p2)
    v2=calculateVector(p2,p3)

    cp=vectorProduct(v1,v2)
    nrm[i] = vectorNormalize(cp)
  }
}

function calculateVector(p1,p2){

 return [ p2[0]-p1[0] , p2[1]-p1[1] , p2[2]-p1[2] ]
}

function cloneVector(v) {

  return v.slice(); 
}

function dirToVector(dir, pixels) {

  dtemp = [0, 0, 0]
  dtemp[dir] = pixels
  return dtemp
}

function line(tt, pstart, pfinish) {

  ctx.moveTo(Math.round(tt[pstart][0]), Math.round(tt[pstart][1]));
  ctx.lineTo(Math.round(tt[pfinish][0]), Math.round(tt[pfinish][1]))

  ctx.stroke()
}

function lineColor(tt, pstart, pfinish, color) {

  ctx.beginPath();
  ctx.strokeStyle = color;
  //ctx.lineWidth = 3;
  ctx.moveTo(Math.round(tt[pstart][0]), Math.round(tt[pstart][1]));
  ctx.lineTo(Math.round(tt[pfinish][0]), Math.round(tt[pfinish][1]))
  ctx.stroke();
  ctx.closePath();
}


function lineColor2(pstart, pfinish, color){

  ctx.beginPath();
  ctx.strokeStyle = color;
  //ctx.lineWidth = 3;
  ctx.moveTo(pstart[0],pstart[1])
  ctx.lineTo(pfinish[0],pfinish[1])
  ctx.stroke()
  ctx.closePath()
}


////////////////////////////////////// / ///////////////////////// / /////////


function vectorMulScalar(v,s){
  
  return [v[0]*s,v[1]*s,v[2]*s]

}

function vectorLength(v){

  return Math.sqrt( v[0]*v[0] + v[1]*v[1] + v[2]*v[2] )

}

function vectorNormalize(v){

  let l = vectorLength(v)

  return [ v[0] / l , v[1] / l , v[2] / l ]
}


function vectorProduct(v1,v2) {

    return [  v1[1]*v2[2]-v1[2]*v2[1]  ,  v1[2]*v2[0]-v1[0]*v2[2]  ,  v1[0]*v2[1]-v1[1]*v2[0]   ]
}


function produs_scalar(v1,v2) {
  
  return v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2]
}

function vectorAddPoint(v,p){

  return [p[0]+v[0],p[1]+v[1],p[2]+v[2]]

}

function angle(v1,v2) {
  return Math.acos(produs_scalar(v1,v2))
}

function lineMiddle (p1,p2) {

  return [ (p1[0]+p2[0])/2 , (p1[1]+p2[1])/2 , (p1[2]+p2[2])/2 ] 


}

function waitForClick() {
     
  return new Promise((resolve) => {

    document.addEventListener('click', function handler(event) {
      document.removeEventListener('click', handler); // Clean up
      resolve(event); // Resume execution
    });
  });
}

async function afiseazaInternal1(t) {
  for (let i=0;i<t.length;i++) {
    // t[i][2]=Math.floor(t[i][2])
  }
  let maxz = -100000000;
  for (let i=0;i<t.length;i++) {
    if (Math.floor(t[i][2]) > maxz) {
      maxz = t[i][2]
    }
  }

  for(let i=0;i<s.length;i++){
    if (t[s[i][0]][2] == maxz || t[s[i][1]][2] == maxz) {
      ctx.lineWidth = 2;
      lineColor(t, s[i][0], s[i][1], 'lightgrey')
    } else {
      ctx.lineWidth = 4;
      lineColor(t, s[i][0], s[i][1], 'black')
    }
  }

  await waitForClick();
}

async function afiseazaInternal3(t) {

  calculateNormals(t,surf,norm2)

  ctx.lineWidth = 2;
  for(let i=0;i<surf.length;i++) {
    // Pasii:
    // line (p1 p2)
    // p1 = lineMiddle(...)
    // p2 = p1 + norm2 * scalar 100
    vn = vectorNormalize(norm2[i])
    p1=lineMiddle(t[surf[i][0]],t[surf[i][2]])
    p2=vectorAddPoint(vectorMulScalar(vn,100),p1)

    if(norm2[i][2]>0){
      let color = 'black'
      lineColor(t,surf[i][0],surf[i][1], color)
      lineColor(t,surf[i][1],surf[i][2], color)
      lineColor(t,surf[i][2],surf[i][3], color)
      lineColor(t,surf[i][3],surf[i][0], color)
            
      lineColor2(p1,p2,"red")  
    }  else{
      

      //lineColor(t,surf[i][0],surf[i][1], color)
      //lineColor(t,surf[i][1],surf[i][2], color)
      //lineColor(t,surf[i][2],surf[i][3], color)
      //lineColor(t,surf[i][3],surf[i][0], color)

      lineColor2(p1,p2,"blue") 
    } 
  }

  await waitForClick();
}



async function afiseaza(t) {

  clear();

  if (document.getElementById("awaitEnabled").checked) {
    await afiseazaInternal3(t);
  } else {
    afiseazaInternal3(t)
  }
}

function clear() {
  ctx.fillStyle = 'white';
  ctx.fillRect(0,0,1300,700)
}


async function init(){

  translate(t,t1,0,0,0)
  updateStatus(t1);

  translateAll(t1,t1,[0,0,300],0)
  await afiseaza (t1)
  updateStatus(t1);

  perspective(t1,t1,pf)
  await afiseaza (t1)
  updateStatus(t1);

  translateAll(t1,t1,mid,0)
  await afiseaza (t1)
  updateStatus(t1);

}

init()

                                   
async function stepTranslate ( dir , pixels ) {
  
  translateAll(t1,t1,minus(mid),0);  await afiseaza (t1)

  perspective_inversion(t1,t1,pf);  await afiseaza (t1)

  // aplicam tastele
  translate(t1,t1,dir,pixels,0);  await afiseaza (t1)

  perspective(t1,t1,pf);           await afiseaza (t1)

  translateAll(t1,t1,mid,0);   await afiseaza (t1)

  d[dir] += pixels
}


async function stepRotate(dir,angle) {

  translateAll(t1,t1,minus(mid),0); await afiseaza (t1)

  perspective_inversion(t1,t1,pf); await afiseaza (t1)

  translateAll(t1,t1, minus(d), 0); await afiseaza (t1)

  translateAll(t1,t1, minus(ppos), 0); await afiseaza (t1)

  rotate(t1,t1,dir,angle); await afiseaza (t1)
  
  translateAll(t1,t1, ppos, 0); await afiseaza (t1)

  translateAll(t1,t1, d, 0); await afiseaza (t1)

  perspective(t1,t1,pf); await afiseaza (t1)

  translateAll(t1,t1,mid,0); await afiseaza (t1)
}

function up(){
  stepTranslate(1,-2,1)
  afiseaza(t1)
  stop++
  console.log("stop=" + stop)
}

function down(){
  stepTranslate(1,2,1)
  afiseaza(t1)
  stop++
  console.log("stop=" + stop)
}

async function keyDown(e) {

  // console.log("e.code = " + e.keyCode);

  if (e.keyCode == 84 /* T */) {   
    stepRotate(1, Math.PI*rotation_factor);
  } 
  if (e.keyCode == 82 /* R */) {   
    stepRotate(1, -1*Math.PI*rotation_factor);
  } 
  if (e.keyCode == 70) /* F */ {
    stepRotate(0, Math.PI*rotation_factor)
  } 
  if (e.keyCode == 71) {   // "G"
    stepRotate(0, -1*Math.PI*rotation_factor)
  } 
  if (e.keyCode == 89 /* Y */ ) { 
    stepRotate(2, Math.PI*rotation_factor)
  } 
  if (e.keyCode == 72 /* H */) { 
    stepRotate(2, -1*Math.PI*rotation_factor)
  } 

  if (e.keyCode == 87) {
     stepTranslate(2,-5);  
  } 
  if (e.keyCode == 83) {
     stepTranslate(2,5);
  }
  if (e.keyCode == 65) {
     stepTranslate(0,5);
  }
  if (e.keyCode == 68) {
     stepTranslate(0,-5);
  }
  if (e.keyCode == 81) {
     stepTranslate(1,5);
  }
  if (e.keyCode == 69) {
     stepTranslate(1,-5);
  }

  if (e.keyCode == 32) {
     //jump();
    space=setInterval(up(),5)
    if(stop==25){
      stop=0
      clearInterval(space)
      console.log("jump")
    }
    space=setInterval(down(),5)
    if(stop==25){
      stop=0
      clearInterval(space)
      console.log("jump")
    }
  }

}

function mouseMove(e) {
  x=e.clientX-20

  lg.textContent = ""
  lg.textContent = "x=" + x + " y=" + y + "\n"

  clear()
  line3(400,350,x,y)
}
